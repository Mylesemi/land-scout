name: Sync Onbid auctions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_onbid.py'
      - 'scripts/enrich_locations.py'
      - 'tests/test_sync_onbid.py'
      - '.github/workflows/sync-onbid.yml'
  schedule:
    - cron: '20 0 * * *'
concurrency:
  group: onbid-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Fetch official API
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ONBID_LIST_ENDPOINT: ${{ vars.ONBID_LIST_ENDPOINT }}
          ONBID_DETAIL_ENDPOINT: ${{ vars.ONBID_DETAIL_ENDPOINT }}
        run: python scripts/sync_onbid.py
      - name: Enrich verified property locations and routes (optional)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_MOBILITY_API_KEY: ${{ secrets.KAKAO_MOBILITY_API_KEY }}
          LAND_SCOUT_ORIGIN_COORDS: ${{ vars.LAND_SCOUT_ORIGIN_COORDS }}
        run: python scripts/enrich_locations.py
      - name: Commit validated data
        run: |
          if git diff --quiet -- data/auctions.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json
          git commit -m "Update verified Onbid auctions"
          git push
