name: Sync Onbid auctions
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official API
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ONBID_LIST_ENDPOINT: ${{ vars.ONBID_LIST_ENDPOINT }}
          ONBID_DETAIL_ENDPOINT: ${{ vars.ONBID_DETAIL_ENDPOINT }}
        run: python scripts/sync_onbid.py
      - name: Commit validated data
        run: |
          if git diff --quiet -- data/auctions.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json
          git commit -m "Update verified Onbid auctions"
          git push
