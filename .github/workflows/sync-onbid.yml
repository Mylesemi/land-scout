name: Sync Onbid auctions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_onbid.py'
      - 'scripts/enrich_locations.py'
      - 'data/geocode_cache.json'
      - 'tests/test_sync_onbid.py'
      - '.github/workflows/sync-onbid.yml'
  schedule:
    - cron: '20 0 * * *'
concurrency:
  group: onbid-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Fetch official API
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ONBID_LIST_ENDPOINT: ${{ vars.ONBID_LIST_ENDPOINT }}
          ONBID_DETAIL_ENDPOINT: ${{ vars.ONBID_DETAIL_ENDPOINT }}
        run: python scripts/sync_onbid.py
      - name: Verify property coordinates using OpenStreetMap (no API key)
        run: python scripts/enrich_locations.py
      - name: Commit validated data
        run: |
          if git diff --quiet -- data/auctions.json data/geocode_cache.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json data/geocode_cache.json
          git commit -m "Update verified Onbid auctions"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Remote updated; replaying data commit on latest main (attempt $attempt)"
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            sleep 2
          done
          echo "Unable to publish updated auction data after retries"
          exit 1
